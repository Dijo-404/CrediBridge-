[package]
name = "credbridge-escrow"
version = "0.1.0"
edition = "2021"

[lib]
name = "credbridge_escrow"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022", "token_2022_extensions"] }
